services:
  - type: web
    name: inventory-management-system
    env: node
    region: oregon
    plan: starter
    buildCommand: npm run build
    startCommand: npm run start:unix
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SQL_SERVER_HOST
        value: 163.227.186.23:2499
      - key: SQL_DATABASE
        value: InventoryDb
      - key: SQL_USER
        sync: false
      - key: SQL_PASSWORD
        sync: false